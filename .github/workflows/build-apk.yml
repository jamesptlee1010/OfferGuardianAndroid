            echo 'Consider deleting the extra inner OfferGuardianAndroid folder later.'
          fi
          project_dir="$(realpath "$selected")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Selected Android project: $project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 35
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run payout parser tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offer-guardian-tests"
          javac -d "$RUNNER_TEMP/offer-guardian-tests" \
            "$PROJECT_DIR/app/src/main/java/com/personal/offerguardian/OfferDetector.java" \
            "$PROJECT_DIR/tests/OfferDetectorStandaloneTest.java"
          java -cp "$RUNNER_TEMP/offer-guardian-tests" \
            com.personal.offerguardian.OfferDetectorStandaloneTest

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --project-dir "$PROJECT_DIR" :app:assembleDebug

      - name: Prepare APK download and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/OfferGuardian-debug.apk
          sha256sum dist/OfferGuardian-debug.apk

      - name: Make APK available to download
        uses: actions/upload-artifact@v6
        with:
          name: OfferGuardian-installable-APK
          path: dist/OfferGuardian-debug.apk
          if-no-files-found: error
          retention-days: 30
