plugins { id 'com.android.application' }

android {
    namespace 'com.personal.offerguardian'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.offerguardian'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.7.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Bundled offline OCR; once installed, no image data is sent to a server.
dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
